[project]
name = "rag-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-chroma",
    "unstructured[pdf]",
    "python-dotenv",
    "pydantic-settings",
    "uuid",
    "pypdf"
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"